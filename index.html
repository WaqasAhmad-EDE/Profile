<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Waqas Ahmad — Senior Full-Stack-Entwickler</title>
<meta name="description" content="Portfolio von Waqas Ahmad, Senior Full-Stack-Entwickler (TypeScript, Angular, React, NestJS) mit Sitz in Deutschland.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0d0f; --bg-alt:#0e1215; --surface:#12171a; --surface-line:#212a2c;
    --lime:#c8ff4d; --lime-dim:#7fae2c; --violet:#7c6cff;
    --text:#e9efe9; --text-dim:#93a19c; --text-faint:#5b6864;
    --radius:14px; --wrap:1180px;
  }
  *,*::before,*::after{ box-sizing:border-box; }
  html{ scroll-behavior:smooth; }
  body{ margin:0; background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; font-size:16px; line-height:1.6; -webkit-font-smoothing:antialiased; }
  h1,h2,h3{ font-family:'Space Grotesk',sans-serif; line-height:1.12; margin:0; font-weight:600; letter-spacing:-0.01em; }
  p{ margin:0; }
  a{ color:inherit; text-decoration:none; }
  img{ max-width:100%; display:block; }
  ul{ margin:0; padding:0; list-style:none; }
  .wrap{ max-width:var(--wrap); margin:0 auto; padding:0 32px; }
  ::selection{ background:var(--lime); color:#0a0d0f; }
  a:focus-visible, button:focus-visible{ outline:2px solid var(--lime); outline-offset:3px; border-radius:4px; }
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important; scroll-behavior:auto !important; }
  }

  .grain{ position:fixed; inset:0; pointer-events:none; z-index:0;
    background-image:radial-gradient(circle at 1px 1px, rgba(255,255,255,.035) 1px, transparent 0);
    background-size:26px 26px; mix-blend-mode:overlay; }

  /* ---------- Header ---------- */
  header{ position:sticky; top:0; z-index:50; background:rgba(10,13,15,.82); backdrop-filter:blur(10px); border-bottom:1px solid var(--surface-line); }
  .nav{ display:flex; align-items:center; justify-content:space-between; height:76px; gap:20px; }
  .logo{ display:flex; align-items:center; gap:2px; font-family:'IBM Plex Mono',monospace; font-size:19px; font-weight:500; color:var(--text); flex-shrink:0; }
  .logo .bracket{ color:var(--lime); }
  .logo .cursor{ width:8px; height:18px; background:var(--lime); margin-left:6px; animation:blink 1.1s steps(1) infinite; }
  @keyframes blink{ 50%{ opacity:0; } }

  .nav-right{ display:flex; align-items:center; gap:24px; }
  .nav-links{ display:flex; align-items:center; gap:30px; }
  .nav-links a{ font-size:14.5px; color:var(--text-dim); position:relative; padding:6px 0; transition:color .2s ease; white-space:nowrap; }
  .nav-links a:hover, .nav-links a.current{ color:var(--text); }
  .nav-links a.current::after{ content:""; position:absolute; left:0; right:0; bottom:0; height:2px; background:var(--lime); border-radius:2px; }

  /* Language toggle */
  .lang-toggle{ display:inline-flex; border:1px solid var(--surface-line); border-radius:8px; overflow:hidden; flex-shrink:0; }
  .lang-toggle button{
    font-family:'IBM Plex Mono',monospace; font-size:12.5px; letter-spacing:.04em;
    background:transparent; color:var(--text-dim); border:none; cursor:pointer;
    padding:8px 13px; transition:background .2s ease, color .2s ease;
  }
  .lang-toggle button:hover{ color:var(--text); }
  .lang-toggle button[aria-pressed="true"]{ background:var(--lime); color:#0a0d0f; font-weight:500; }

  .btn{ display:inline-flex; align-items:center; gap:8px; padding:11px 22px; border-radius:8px; font-size:14.5px; font-weight:500;
    border:1px solid transparent; cursor:pointer; white-space:nowrap;
    transition:transform .15s ease, background .2s ease, border-color .2s ease, color .2s ease; }
  .btn-primary{ background:var(--lime); color:#0a0d0f; }
  .btn-primary:hover{ transform:translateY(-1px); background:#d8ff77; }
  .btn-ghost{ border-color:var(--surface-line); color:var(--text); }
  .btn-ghost:hover{ border-color:var(--lime); }

  .menu-toggle{ display:none; flex-direction:column; gap:5px; background:none; border:none; cursor:pointer; padding:8px; }
  .menu-toggle span{ width:22px; height:2px; background:var(--text); border-radius:2px; }

  /* ---------- Hero ---------- */
  .hero{ position:relative; padding:96px 0 70px; overflow:hidden; }
  .hero-grid{ display:grid; grid-template-columns:1.05fr .85fr; gap:56px; align-items:center; }
  .eyebrow-line{ display:flex; align-items:center; gap:10px; color:var(--text-faint); font-size:13.5px; margin-bottom:22px; }
  .eyebrow-line .dot{ width:7px; height:7px; border-radius:50%; background:var(--lime); box-shadow:0 0 10px 2px rgba(200,255,77,.55); flex-shrink:0; }
  .hero h1{ font-size:clamp(32px,4.2vw,50px); max-width:16ch; }
  .hero h1 .accent{ color:var(--lime); }
  .hero .role-line{ margin-top:16px; font-family:'IBM Plex Mono',monospace; font-size:15px; color:var(--lime-dim); }
  .hero p.lede{ margin-top:20px; max-width:50ch; color:var(--text-dim); font-size:16.5px; }
  .hero-cta{ display:flex; align-items:center; gap:14px; margin-top:32px; flex-wrap:wrap; }
  .hero-social{ display:flex; gap:12px; margin-top:28px; }
  .hero-social a{ width:38px; height:38px; border-radius:8px; border:1px solid var(--surface-line);
    display:flex; align-items:center; justify-content:center; color:var(--text-dim);
    transition:border-color .2s ease, color .2s ease; }
  .hero-social a:hover{ border-color:var(--lime); color:var(--lime); }

  .hero-art{ position:relative; aspect-ratio:1/1; display:flex; align-items:center; justify-content:center; }
  .hero-art svg{ width:100%; height:100%; }
  .orbit-spin{ transform-origin:250px 250px; animation:spin 34s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .orbit-spin-rev{ transform-origin:250px 250px; animation:spinrev 46s linear infinite; }
  @keyframes spinrev{ to{ transform:rotate(-360deg); } }

  /* ---------- Stats ---------- */
  .stats{ border-top:1px solid var(--surface-line); border-bottom:1px solid var(--surface-line); background:var(--bg-alt); }
  .stats-grid{ display:grid; grid-template-columns:repeat(4,1fr); }
  .stat{ padding:44px 28px; border-right:1px solid var(--surface-line); }
  .stat:last-child{ border-right:none; }
  .stat-num{ font-family:'Space Grotesk',sans-serif; font-size:38px; font-weight:700; color:var(--lime); display:flex; align-items:baseline; gap:2px; }
  .stat-label{ margin-top:10px; font-weight:600; font-size:15px; }
  .stat-desc{ margin-top:8px; font-size:13.8px; color:var(--text-dim); max-width:32ch; }

  /* ---------- Sections ---------- */
  section{ position:relative; }
  .section-pad{ padding:104px 0; }
  .section-head{ display:grid; grid-template-columns:.9fr 1.1fr; gap:56px; margin-bottom:56px; align-items:end; }
  .section-head h2{ font-size:clamp(28px,3.2vw,38px); }
  .section-head .lede{ color:var(--text-dim); font-size:15.5px; }
  .kicker{ font-family:'IBM Plex Mono',monospace; font-size:13px; color:var(--lime-dim); margin-bottom:14px; display:block; }

  /* ---------- About ---------- */
  .story-grid{ display:grid; grid-template-columns:.86fr 1.14fr; gap:64px; align-items:center; }
  .term-window{ background:var(--surface); border:1px solid var(--surface-line); border-radius:var(--radius);
    overflow:hidden; box-shadow:0 30px 70px -30px rgba(0,0,0,.7); }
  .term-bar{ display:flex; align-items:center; gap:8px; padding:13px 16px; border-bottom:1px solid var(--surface-line); }
  .term-bar span.dotb{ width:10px; height:10px; border-radius:50%; background:#5f5751; }
  .term-bar .file{ margin-left:10px; font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--text-faint); }
  .term-body{ padding:24px 22px 30px; font-family:'IBM Plex Mono',monospace; font-size:13.2px; line-height:1.9; }
  .term-body .l1{ color:var(--text-faint); }
  .term-body .l2{ color:var(--violet); }
  .term-body .l3{ color:var(--text-dim); padding-left:18px; display:block; }
  .term-body .l4{ color:var(--lime); }
  .term-body .str{ color:#e7c67a; }
  .term-cursor{ display:inline-block; width:7px; height:14px; background:var(--lime); vertical-align:middle; margin-left:4px; animation:blink 1.1s steps(1) infinite; }
  .story-copy p{ color:var(--text-dim); font-size:15.5px; }
  .story-copy p + p{ margin-top:18px; }

  /* ---------- Skills ---------- */
  .skills-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:24px; }
  .skill-card{ padding:26px 24px; background:var(--surface); border:1px solid var(--surface-line); border-radius:var(--radius); }
  .skill-icon{ width:34px; height:34px; margin-bottom:16px; }
  .skill-card h3{ font-size:16.5px; }
  .skill-tags{ display:flex; flex-wrap:wrap; gap:8px; margin-top:14px; }
  .skill-tags span{ font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--text-dim);
    border:1px solid var(--surface-line); border-radius:6px; padding:4px 9px; }

  /* ---------- Projects ---------- */
  .projects-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:24px; }
  .project-card{ background:var(--surface); border:1px solid var(--surface-line); border-radius:var(--radius);
    overflow:hidden; display:flex; flex-direction:column; transition:border-color .2s ease, transform .2s ease; }
  .project-card:hover{ border-color:var(--lime-dim); transform:translateY(-2px); }
  .project-thumb{ aspect-ratio:16/9; position:relative; overflow:hidden;
    background:linear-gradient(150deg,var(--ptint1),var(--ptint2)); display:flex; align-items:center; justify-content:center; }
  .project-thumb::after{ content:""; position:absolute; inset:0;
    background-image:linear-gradient(rgba(10,13,15,.14) 1px,transparent 1px),linear-gradient(90deg,rgba(10,13,15,.14) 1px,transparent 1px);
    background-size:22px 22px; }
  .project-thumb svg{ position:relative; z-index:1; width:52px; height:52px; }
  .project-index{ position:absolute; top:14px; left:16px; z-index:1; font-family:'IBM Plex Mono',monospace; font-size:12px; color:rgba(10,13,15,.55); }
  .project-body{ padding:24px 26px 28px; display:flex; flex-direction:column; flex:1; }
  .project-body h3{ font-size:18px; }
  .project-body .role{ margin-top:4px; font-size:12.5px; color:var(--text-faint); font-family:'IBM Plex Mono',monospace; }
  .project-points{ margin-top:14px; flex:1; }
  .project-points li{ position:relative; padding-left:18px; color:var(--text-dim); font-size:14.2px; margin-bottom:8px; }
  .project-points li::before{ content:""; position:absolute; left:0; top:9px; width:6px; height:6px; border-radius:50%; background:var(--lime-dim); }
  .project-tags{ display:flex; flex-wrap:wrap; gap:8px; margin-top:16px; }
  .project-tags span{ font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--text-dim);
    border:1px solid var(--surface-line); border-radius:6px; padding:4px 9px; }
  .project-link{ margin-top:18px; display:inline-flex; align-items:center; gap:6px; font-size:13.5px; font-weight:500; color:var(--lime); align-self:flex-start; }
  .project-link svg{ transition:transform .15s ease; }
  .project-link:hover svg{ transform:translate(2px,-2px); }

  /* ---------- Timeline (experience + education) ---------- */
  .timeline{ position:relative; padding-left:32px; border-left:1px solid var(--surface-line); }
  .timeline-item{ position:relative; padding-bottom:48px; }
  .timeline-item:last-child{ padding-bottom:0; }
  .timeline-item::before{ content:""; position:absolute; left:-37px; top:5px; width:11px; height:11px;
    border-radius:50%; background:var(--bg); border:2px solid var(--lime); }
  .timeline-year{ font-family:'IBM Plex Mono',monospace; font-size:13px; color:var(--lime-dim); }
  .timeline-item h3{ font-size:18px; margin-top:8px; }
  .timeline-role{ font-size:14px; color:var(--text-dim); margin-top:4px; }
  .timeline-points{ margin-top:14px; max-width:68ch; }
  .timeline-points li{ position:relative; padding-left:18px; color:var(--text-dim); font-size:14.5px; margin-bottom:9px; }
  .timeline-points li::before{ content:""; position:absolute; left:0; top:9px; width:6px; height:6px; border-radius:50%; background:var(--surface-line); }
  .timeline-meta{ margin-top:10px; font-size:13.5px; color:var(--text-faint); font-family:'IBM Plex Mono',monospace; }

  /* ---------- Info cards ---------- */
  .info-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:24px; }
  .info-card{ padding:26px 24px; background:var(--surface); border:1px solid var(--surface-line); border-radius:var(--radius); }
  .info-card .info-icon{ width:30px; height:30px; margin-bottom:14px; }
  .info-card h3{ font-size:15.5px; }
  .info-card p{ margin-top:8px; color:var(--text-dim); font-size:14px; }

  /* ---------- CTA + footer ---------- */
  .cta-band{ border-top:1px solid var(--surface-line); padding:80px 0; }
  .cta-inner{ display:flex; align-items:center; justify-content:space-between; gap:32px; flex-wrap:wrap; }
  .cta-inner h2{ font-size:clamp(24px,3vw,32px); max-width:22ch; }
  .cta-inner p{ color:var(--text-dim); margin-top:10px; }
  footer{ border-top:1px solid var(--surface-line); padding:48px 0; }
  .footer-row{ display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:20px; }
  .footer-links{ display:flex; gap:26px; flex-wrap:wrap; }
  .footer-links a{ font-size:13.5px; color:var(--text-dim); }
  .footer-links a:hover{ color:var(--text); }
  .copyright{ font-size:13px; color:var(--text-faint); }

  /* ---------- Responsive ---------- */
  @media (max-width:1050px){ .nav-links{ gap:22px; } }
  @media (max-width:960px){
    .hero-grid{ grid-template-columns:1fr; }
    .hero-art{ max-width:320px; margin:0 auto; order:-1; }
    .stats-grid{ grid-template-columns:repeat(2,1fr); }
    .stat:nth-child(2){ border-right:none; }
    .stat{ border-bottom:1px solid var(--surface-line); }
    .section-head{ grid-template-columns:1fr; gap:16px; }
    .story-grid{ grid-template-columns:1fr; }
    .skills-grid{ grid-template-columns:repeat(2,1fr); }
    .projects-grid{ grid-template-columns:1fr; }
    .info-grid{ grid-template-columns:repeat(2,1fr); }
  }
  @media (max-width:640px){
    .wrap{ padding:0 20px; }
    .nav-links{ position:fixed; top:76px; left:0; right:0; background:var(--bg); border-bottom:1px solid var(--surface-line);
      flex-direction:column; align-items:flex-start; gap:0; padding:8px 20px 20px;
      transform:translateY(-8px); opacity:0; visibility:hidden;
      transition:opacity .2s ease, transform .2s ease, visibility .2s; }
    .nav-links.open{ opacity:1; visibility:visible; transform:translateY(0); }
    .nav-links a{ padding:12px 0; width:100%; border-bottom:1px solid var(--surface-line); }
    .nav-links .btn{ margin-top:14px; width:100%; justify-content:center; }
    .menu-toggle{ display:flex; }
    .nav-right{ gap:10px; }
    .stats-grid{ grid-template-columns:1fr 1fr; }
    .skills-grid, .info-grid{ grid-template-columns:1fr; }
    .cta-inner{ flex-direction:column; align-items:flex-start; }
  }
</style>
</head>
<body>
<div class="grain"></div>

<header>
  <div class="wrap nav">
    <a href="#hero" class="logo"><span class="bracket">&gt;_</span>waqas<span class="cursor"></span></a>
    <div class="nav-right">
      <nav class="nav-links" id="navLinks"></nav>
      <div class="lang-toggle" role="group" aria-label="Sprache / Language">
        <button type="button" data-lang="de" aria-pressed="true">DE</button>
        <button type="button" data-lang="en" aria-pressed="false">EN</button>
      </div>
      <button class="menu-toggle" id="menuToggle" aria-label="Menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>

</header>

<main>

  <!-- HERO -->
  <section class="hero" id="hero">
    <div class="wrap hero-grid">
      <div id="heroCopy"></div>

        <svg viewBox="0 0 500 500" fill="none" xmlns="http://www.w3.org/2000/svg">

  <!-- STATS -->

  <!-- ABOUT -->

            <span class="l2">const</span> waqas = {<br>

            <span class="l3">stack: [<span class="str">"Angular"</span>, <span class="str">"NestJS"</span>, <span class="str">"React"</span>],</span>
            <span class="l3">base: <span class="str">"Germany"</span></span>

  <!-- SKILLS -->
  <section class="section-pad" id="skills" style="padding-top:0;">
    <div class="wrap">

  <!-- PROJECTS -->

  <!-- EXPERIENCE -->

  <!-- EDUCATION -->
  <section class="section-pad" id="education" style="padding-top:0;">

      <div class="section-head"><div id="head-education"></div></div>
      <div class="timeline" id="educationList"></div>
    </div>
  </section>

  <!-- ADDITIONAL INFO -->
  <section class="section-pad" id="info" style="padding-top:0;">
    <div class="wrap">
      <div class="section-head"><div id="head-info"></div></div>
      <div class="info-grid" id="infoGrid"></div>
    </div>

  <!-- CTA -->
  <section class="cta-band" id="contact">

  </section>

</main>

<footer>
  <div class="wrap footer-row">
    <a href="#hero" class="logo" style="font-size:16px;"><span class="bracket">&gt;_</span>waqas</a>
    <div class="footer-links" id="footerLinks"></div>
    <div class="copyright" id="copyright"></div>
  </div>
</footer>

<script>
/* ==========================================================================
   ALL CONTENT LIVES HERE — edit / append freely.
   Every text field is bilingual: { de: "Deutsch", en: "English" }
   Language-neutral fields (tags, dates, links, icon, theme) are written once.

   icon:  code · browser · server · database · test · cloud · branch · gear
          phone · spark · chart · cane · brain · house · cap · id · car · globe
   theme: lime · violet · silver · moss
   ========================================================================== */
const PROFILE = {

  email: "waqas.ede@gmail.com",
  links: {
    linkedin: "#",   // ← paste your LinkedIn URL
    github:   "#",   // ← paste your GitHub URL
    portfolio:"#"    // ← paste your portfolio URL
  }
};

const DATA = {

  /* ---- Hero ------------------------------------------------------------- */
  hero: {
    availability: {
      de: "Ab sofort verfügbar · Deutschland · Arbeitserlaubnis vorhanden",
      en: "Available immediately · Germany · Eligible to work"
    },
    role: {
      de: "Senior Full-Stack-Entwickler",
      en: "Senior Full-Stack Developer"
    },
    headline: {
      de: ["Hallo, ich bin ", "Waqas", " — Senior Full-Stack-Entwickler"],
      en: ["Hi, I'm ", "Waqas", " — Senior Full-Stack Developer"]

    return String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function icon(name, color, cls){
    const body = (ICONS[name] || ICONS.code).replace(/CC/g, color);
    return '<svg' + (cls ? ' class="'+cls+'"' : '') + ' viewBox="0 0 40 40" fill="none">' + body + '</svg>';
  }
  function mount(id, html){ const el = document.getElementById(id); if (el) el.innerHTML = html; return el; }
  function bullets(list, cls){
    return '<ul class="'+cls+'">' + (list||[]).map(p => '<li>'+esc(t(p))+'</li>').join('') + '</ul>';
  }
  function head(key){
    const h = UI.heads[key];
    return '<span class="kicker">'+esc(t(h.kicker))+'</span><h2>'+esc(t(h.title))+'</h2>';
  }
  function extLink(url){ return url && url !== '#' ? ' target="_blank" rel="noopener"' : ''; }

  const SOCIAL = {
    github:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 2C6.48 2 2 6.58 2 12.18c0 4.49 2.87 8.3 6.84 9.64.5.1.68-.22.68-.49 0-.24-.01-1.03-.01-1.87-2.78.62-3.37-1.19-3.37-1.19-.45-1.17-1.11-1.48-1.11-1.48-.91-.63.07-.62.07-.62 1 .07 1.53 1.05 1.53 1.05.89 1.55 2.34 1.1 2.91.84.09-.66.35-1.1.63-1.36-2.22-.26-4.56-1.14-4.56-5.06 0-1.12.39-2.03 1.03-2.75-.1-.26-.45-1.31.1-2.72 0 0 .84-.27 2.75 1.05a9.4 9.4 0 0 1 5 0c1.91-1.32 2.75-1.05 2.75-1.05.55 1.41.2 2.46.1 2.72.64.72 1.03 1.63 1.03 2.75 0 3.93-2.34 4.8-4.57 5.05.36.32.68.94.68 1.9 0 1.37-.01 2.47-.01 2.81 0 .27.18.6.69.49A10.2 10.2 0 0 0 22 12.18C22 6.58 17.52 2 12 2Z" fill="currentColor"/></svg>',
    linkedin:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M6.94 8.5H3.56V20h3.38V8.5ZM5.25 3.5A1.96 1.96 0 1 0 5.27 7.4a1.96 1.96 0 0 0-.02-3.9ZM20.44 20h-3.37v-5.98c0-1.43-.03-3.26-1.98-3.26-1.99 0-2.3 1.55-2.3 3.16V20H9.42V8.5h3.24v1.57h.05c.45-.85 1.56-1.75 3.2-1.75 3.43 0 4.06 2.26 4.06 5.2V20Z" fill="currentColor"/></svg>',
    portfolio:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.6"/><path d="M3 12h18M12 3c2.5 3 3.5 5.7 3.5 9s-1 6-3.5 9c-2.5-3-3.5-5.7-3.5-9s1-6 3.5-9Z" stroke="currentColor" stroke-width="1.6"/></svg>',
    email:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M4 5h16a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1Z" stroke="currentColor" stroke-width="1.5"/><path d="m3.5 6 8.5 6.5L20.5 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>'
  };

  const arrow = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M7 17 17 7M9 7h8v8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  /* ---------------- render everything ---------------- */
  function render(){
    document.documentElement.lang = LANG;
    document.title = PROFILE.name + ' — ' + t(DATA.hero.role);

    /* Nav */
    mount('navLinks',
      ['about','skills','projects','experience','education'].map(k =>
        '<a href="#'+k+'" data-nav="'+k+'">'+esc(t(UI.nav[k]))+'</a>').join('') +
      '<a href="#contact" class="btn btn-primary">'+esc(t(UI.nav.contact))+'</a>'
    );
    /* re-bind nav clicks (menu close) */
    const links = document.getElementById('navLinks');
    links.querySelectorAll('a').forEach(a => a.addEventListener('click', closeMenu));

    /* Hero */
    const hl = t(DATA.hero.headline);
    mount('heroCopy',
      '<div class="eyebrow-line"><span class="dot"></span>'+esc(t(DATA.hero.availability))+'</div>' +
      '<h1>'+esc(hl[0])+'<span class="accent">'+esc(hl[1])+'</span>'+esc(hl[2])+'</h1>' +
      '<div class="role-line">'+esc(t(DATA.hero.role))+'</div>' +
      '<p class="lede">'+esc(t(DATA.hero.lede))+'</p>' +
      '<div class="hero-cta">' +
        '<a href="mailto:'+esc(PROFILE.email)+'" class="btn btn-primary">'+esc(t(UI.cta.button))+'</a>' +
        '<a href="#projects" class="btn btn-ghost">'+esc(t(UI.nav.projects))+'</a>' +
      '</div>' +
      '<div class="hero-social">' +
        '<a href="'+esc(PROFILE.links.github)+'"'+extLink(PROFILE.links.github)+' aria-label="GitHub" title="GitHub">'+SOCIAL.github+'</a>' +
        '<a href="'+esc(PROFILE.links.linkedin)+'"'+extLink(PROFILE.links.linkedin)+' aria-label="LinkedIn" title="LinkedIn">'+SOCIAL.linkedin+'</a>' +
        '<a href="'+esc(PROFILE.links.portfolio)+'"'+extLink(PROFILE.links.portfolio)+' aria-label="Portfolio" title="Portfolio">'+SOCIAL.portfolio+'</a>' +
        '<a href="mailto:'+esc(PROFILE.email)+'" aria-label="Email" title="'+esc(PROFILE.email)+'">'+SOCIAL.email+'</a>' +
      '</div>'
    );

    /* Stats */
    mount('statsGrid', DATA.stats.map(s =>
      '<div class="stat">' +
        '<div class="stat-num"><span class="counter" data-target="'+(Number(s.value)||0)+'" data-format="'+esc(s.format||'')+'">0</span>'+esc(s.suffix||'')+'</div>' +
        '<div class="stat-label">'+esc(t(s.label))+'</div>' +
        '<p class="stat-desc">'+esc(t(s.desc))+'</p>' +
      '</div>').join(''));

    /* About */
    mount('head-about', head('about'));
    mount('aboutCopy', t(DATA.about).map(p => '<p>'+esc(p)+'</p>').join(''));

    /* Skills */
    mount('head-skills', head('skills'));
    mount('lede-skills', esc(t(UI.heads.skills.lede)));
    mount('skillsGrid', DATA.skills.map(s =>
      '<div class="skill-card">' +
        icon(s.icon, ACCENTS[s.theme] || ACCENTS.lime, 'skill-icon') +
        '<h3>'+esc(t(s.title))+'</h3>' +
        '<div class="skill-tags">'+(s.tags||[]).map(x => '<span>'+esc(t(x))+'</span>').join('')+'</div>' +
      '</div>').join(''));

    /* Projects */
    mount('head-projects', head('projects'));
    mount('lede-projects', esc(t(UI.heads.projects.lede)));
    mount('projectsGrid', DATA.projects.map((p,i) => {
      const pair = THEMES[p.theme] || THEMES.lime;
      return '<div class="project-card">' +
        '<div class="project-thumb" style="--ptint1:'+pair[0]+'; --ptint2:'+pair[1]+';">' +
          '<span class="project-index">'+String(i+1).padStart(2,'0')+'</span>' + icon(p.icon,'#0a0d0f') +
        '</div>' +
        '<div class="project-body">' +
          '<h3>'+esc(t(p.title))+'</h3>' +
          '<div class="role">'+esc(t(p.role))+'</div>' +
          bullets(t(p.points), 'project-points') +
          '<div class="project-tags">'+(p.tags||[]).map(x => '<span>'+esc(t(x))+'</span>').join('')+'</div>' +
          (p.link ? '<a href="'+esc(p.link)+'"'+extLink(p.link)+' class="project-link">'+esc(t(UI.viewProject))+' '+arrow+'</a>' : '') +
        '</div></div>';
    }).join(''));

    /* Experience */
    mount('head-experience', head('experience'));
    mount('timeline', DATA.experience.map(e =>
      '<div class="timeline-item">' +
        '<div class="timeline-year">'+esc(t(e.period))+'</div>' +
        '<h3>'+esc(t(e.title))+'</h3>' +
        '<div class="timeline-role">'+esc(t(e.company))+'</div>' +
        bullets(t(e.points), 'timeline-points') +
      '</div>').join(''));

    /* Education */
    mount('head-education', head('education'));
    mount('educationList', DATA.education.map(e =>
      '<div class="timeline-item">' +
        '<div class="timeline-year">'+esc(t(e.period))+'</div>' +
        '<h3>'+esc(t(e.title))+'</h3>' +
        '<div class="timeline-role">'+esc(t(e.school))+'</div>' +
        '<div class="timeline-meta">'+esc(t(e.meta))+'</div>' +
      '</div>').join(''));

    /* Additional info */
    mount('head-info', head('info'));
    mount('infoGrid', DATA.info.map(c =>
      '<div class="info-card">' +
        icon(c.icon, ACCENTS[c.theme] || ACCENTS.lime, 'info-icon') +
        '<h3>'+esc(t(c.title))+'</h3>' +
        '<p>'+esc(t(c.desc))+'</p>' +
      '</div>').join(''));

    /* CTA */
    mount('ctaInner',
      '<div><h2>'+esc(t(UI.cta.title))+'</h2><p>'+esc(t(UI.cta.text))+'</p></div>' +
      '<a href="mailto:'+esc(PROFILE.email)+'" class="btn btn-primary">'+esc(t(UI.cta.button))+'</a>');

    /* Footer */
    mount('footerLinks',
      ['about','skills','projects','experience','education','contact']
        .map(k => '<a href="#'+k+'">'+esc(t(UI.nav[k]))+'</a>').join(''));
    mount('copyright', '© ' + new Date().getFullYear() + ' ' + esc(PROFILE.name) + '. ' + esc(t(UI.rights)));

    startCounters();
    startScrollSpy();
  }

  /* ---------------- counters ---------------- */
  let observer = null;
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function fmt(n, format){
    return format === 'thousands' ? n.toLocaleString(LANG === 'de' ? 'de-DE' : 'en-US') : String(n);
  }
  function animateCounter(el){
    const target = parseInt(el.getAttribute('data-target'), 10) || 0;
    const format = el.getAttribute('data-format');
    if (reduceMotion){ el.textContent = fmt(target, format); return; }
    const duration = 1400;
    let start = null;
    function step(ts){
      if (start === null) start = ts;
      const progress = Math.min((ts - start) / duration, 1);
      const eased = 1 - Math.pow(1 - progress, 3);
      el.textContent = fmt(Math.floor(eased * target), format);
      if (progress < 1) requestAnimationFrame(step);
      else el.textContent = fmt(target, format);
    }
    requestAnimationFrame(step);
  }
  function startCounters(){
    const counters = document.querySelectorAll('.counter');
    if (observer) observer.disconnect();
    if ('IntersectionObserver' in window){
      observer = new IntersectionObserver(entries => {
        entries.forEach(entry => {
          if (entry.isIntersecting){ animateCounter(entry.target); observer.unobserve(entry.target); }
        });
      }, { threshold: 0.6 });
      counters.forEach(c => observer.observe(c));
    } else {
      counters.forEach(animateCounter);
    }
  }

  /* ---------------- scroll-spy (active nav highlight) ---------------- */
  let spyObserver = null;

  function setActiveNav(id){
    document.querySelectorAll('#navLinks a[data-nav]').forEach(a => {
      a.classList.toggle('current', a.getAttribute('data-nav') === id);
    });
  }

  function startScrollSpy(){
    const navKeys = ['about','skills','projects','experience','education'];
    const sections = navKeys
      .map(id => document.getElementById(id))
      .filter(Boolean);

    if (spyObserver) spyObserver.disconnect();
    if (!sections.length) return;

    if (!('IntersectionObserver' in window)){
      setActiveNav(navKeys[0]);
      return;
    }

    // Track intersection ratios so we always highlight whichever
    // section currently occupies most of the space below the header.
    const ratios = new Map();

    spyObserver = new IntersectionObserver(entries => {
      entries.forEach(entry => ratios.set(entry.target.id, entry.intersectionRatio));

      let bestId = null, bestRatio = 0;
      ratios.forEach((ratio, id) => {
        if (ratio > bestRatio){ bestRatio = ratio; bestId = id; }
      });

      if (bestId) setActiveNav(bestId);
    }, {
      // Shrink the viewport from the top (sticky 76px header) and bottom,
      // so a section counts as "active" once it's the main thing on screen.
      rootMargin: '-90px 0px -60% 0px',
      threshold: [0, 0.25, 0.5, 0.75, 1]
    });

    sections.forEach(s => spyObserver.observe(s));
    setActiveNav(navKeys[0]); // sensible default before any scrolling
  }

  /* ---------------- mobile menu ---------------- */
  const toggle = document.getElementById('menuToggle');
  function closeMenu(){
    document.getElementById('navLinks').classList.remove('open');
    toggle.setAttribute('aria-expanded','false');
  }
  toggle.addEventListener('click', function(){
    const open = document.getElementById('navLinks').classList.toggle('open');
    toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
  });

  /* ---------------- language toggle ---------------- */
  const langButtons = document.querySelectorAll('.lang-toggle button');
  langButtons.forEach(btn => btn.addEventListener('click', function(){
    const next = btn.getAttribute('data-lang');
    if (next === LANG) return;
    LANG = next;
    langButtons.forEach(b => b.setAttribute('aria-pressed', b === btn ? 'true' : 'false'));
    render();
    closeMenu();
  }));

  render();
})();
</script>
